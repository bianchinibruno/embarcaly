name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: tipos e bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      # Falha se a cobertura cair de 100% no domínio ou nos componentes. As
      # regras de negócio são o que não pode quebrar em silêncio: horários
      # derivados, estado do cartão de embarque, nome de anexo. E os
      # componentes guardam invariantes que já quebraram na prática, como
      # bilhete tocável não conter botão dentro de botão.
      - name: Testes de domínio e componentes (cobertura 100%)
        run: npm run test:coverage -- --ci

      - name: Configuração do projeto
        run: npx expo-doctor

      # Compila o bundle de verdade. Typecheck sozinho não pega import quebrado
      # nem dependência nativa faltando — só o empacotamento pega.
      - name: Bundle Android
        run: npx expo export --platform android --output-dir ./.export

      - name: Bundle iOS
        run: npx expo export --platform ios --output-dir ./.export-ios
